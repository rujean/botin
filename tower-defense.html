<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense - Huertas TD - v6</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a2e;color:#eee;font-family:Segoe UI,sans-serif;display:flex;justify-content:center;padding:20px}
  .wrap{background:#16213e;border-radius:16px;padding:20px;max-width:750px}
  h1{text-align:center;color:#e94560;font-size:22px;margin-bottom:10px}
  h1 span{color:#ffd700}
  .bar{display:flex;gap:16px;justify-content:center;margin:10px 0;font-size:14px;flex-wrap:wrap}
  .bar div{background:#0f3460;padding:5px 14px;border-radius:8px}
  .bar .v{color:#ffd700;font-weight:bold}
  canvas{display:block;margin:0 auto;border-radius:8px;border:2px solid #0f3460;cursor:crosshair;max-width:100%;background:#1a1a2e}
  .ctl{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  .ctl button{background:#e94560;color:#fff;border:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px;transition:.2s}
  .ctl button:hover{filter:brightness(1.2);transform:scale(1.05)}
  .ctl .sec{background:#0f3460}
  .ctl .act{border:2px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.3)}
  .msg{text-align:center;margin:8px 0;font-size:13px;color:#aaa;min-height:22px}
  .leyenda{text-align:center;font-size:12px;color:#888;margin:4px 0}
  .leyenda span{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 3px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128163; <span>Huertas</span> Tower Defense</h1>
  <div class="bar">
    <div>&#128176; $<span class="v" id="dinero">500</span></div>
    <div>&#10084;&#65039; <span class="v" id="vidas">50</span></div>
    <div>&#127754; <span class="v" id="oleada">0</span></div>
    <div>&#128128; <span class="v" id="kills">0</span></div>
    <div>&#127942; <span class="v" id="bosses">0</span></div>
    <div>&#128147; <span class="v" id="torresV">0</span></div>
  </div>
  <canvas id="g" width="620" height="620"></canvas>
  <div class="leyenda">
    <span style="background:#e94560"></span>T1 ($50) 1b rapida 3hp
    <span style="background:#ffd700"></span>T2 ($100) 2b ralentiza 3hp
    <span style="background:#00d2ff"></span>T3 ($150) 3b rapida 3hp
  </div>
  <div class="ctl">
    <button id="bOleada" class="sec">Sgte Oleada</button>
    <button id="bAuto" class="sec">Auto</button>
    <button id="bT1" class="act" style="background:#e94560">T1 $50</button>
    <button id="bT2" style="background:#ffd700;color:#333">T2 $100</button>
    <button id="bT3" style="background:#00d2ff;color:#333">T3 $150</button>
    <button id="bReiniciar" style="background:#555">Reiniciar</button>
  </div>
  <div class="msg" id="msg">T1 seleccionada</div>
</div>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d'),W=620,H=620,CL=31;

const RUTAS = [
  {puntos:[[0,3],[4,3],[4,7],[8,7],[8,3],[12,3],[12,7],[16,7],[16,3],[19,3]]},
  {puntos:[[0,10],[4,10],[4,6],[8,6],[8,10],[12,10],[12,14],[16,14],[16,10],[19,10]]},
  {puntos:[[0,17],[4,17],[4,13],[8,13],[8,17],[12,17],[12,11],[16,11],[16,17],[19,17]]}
];
RUTAS.forEach(r=>{r.px=r.puntos.map(p=>({x:p[0]*CL+CL/2,y:p[1]*CL+CL/2}));r.pd=[0];for(let i=1;i<r.px.length;i++)r.pd.push(r.pd[i-1]+Math.hypot(r.px[i].x-r.px[i-1].x,r.px[i].y-r.px[i-1].y));r.PL=r.pd[r.pd.length-1];});
function posR(d,ri){let r=RUTAS[ri];if(!r)return{x:310,y:310};if(d<=0)return{x:r.px[0].x,y:r.px[0].y};if(d>=r.PL)return{x:r.px[r.px.length-1].x,y:r.px[r.px.length-1].y};for(let i=1;i<r.px.length;i++)if(d<=r.pd[i]){let t=(d-r.pd[i-1])/(r.pd[i]-r.pd[i-1]);return{x:r.px[i-1].x+(r.px[i].x-r.px[i-1].x)*t,y:r.px[i-1].y+(r.px[i].y-r.px[i-1].y)*t}}return{x:r.px[r.px.length-1].x,y:r.px[r.px.length-1].y};}
const todosPuntos=RUTAS.reduce((a,r)=>a.concat(r.puntos),[]);

// TORRES: T1(1b rapida,1hp), T2(2b ralentiza 20%,2hp), T3(3b rapida,3hp)
const TI={
  t1:{costo:50,rango:120,dmg:18,vel:12,color:'#e94560',balas:1,vida:3},
  t2:{costo:100,rango:150,dmg:20,vel:18,color:'#ffd700',balas:2,vida:3,ralentiza:0.8},
  t3:{costo:150,rango:180,dmg:30,vel:12,color:'#00d2ff',balas:3,vida:3}
};

// ENEMIGOS pequeños: rango=T1(120), disparan 1 bala que quita 1 vida
// BOSSES: rango=T3*1.2(216), disparan balas que quitan 3 vidas
const RANGO_ENEMIGO = 60;
const RANGO_BOSS = 216; // 180 * 1.2
const DMG_BALA_ENEMIGO = 1;
const DMG_BALA_BOSS = 3;

let dn=500,vd=50,kl=0,ol=0,be=0,en=[],tr=[],bl=[],go=0,vi=0,au=0,ts='t1',mx=0,my=0,rg={};

function velOleada(n){return 1+(n-1)*0.2;}
function numJefes(n){return n/10;}
function dispJefe(n){return n/10;}

function rutaAleatoria(){return Math.floor(Math.random()*3);}

function ce(vl,vl2,vr,rc,b,ri){
  let idx=ri!==undefined?ri:rutaAleatoria();
  return{dist:0,vida:vl,mv:vl2||vl,vel:vr,rec:rc,vivo:1,boss:!!b,cd:b?0:0,ruta:idx,ralentizado:false};
}

function gob(n){if(vi||go)return;
if(n>30){vi=1;ms('VICTORIA! 30 oleadas!');return;}
let cnt=4+n*2,vb=30+n*8,v=velOleada(n),boss=n%10===0,nj=numJefes(n),dj=dispJefe(n);
if(boss){
  ms(nj+' BOSS x ruta! ('+(nj*3)+' total)');
  for(let r=0;r<3;r++){for(let j=0;j<nj;j++){setTimeout(()=>{if(!go&&!vi){let b2=ce(vb*5,vb*5,v*0.6,200+n*20,1,r);b2.dj=dj;en.push(b2);}},500+(r*400)+(j*600));}}
}else{
  ms('Oleada '+n+' ('+cnt+' x ruta, vel:'+v.toFixed(1)+')');
  for(let r=0;r<3;r++){for(let i=0;i<cnt;i++){setTimeout(()=>{if(!go&&!vi)en.push(ce(vb,vb,v,10+n*2,0,r))},i*250+r*400);}}
}
ol=n;document.getElementById('oleada').textContent=n;}

function ct(c,r,tp){
  for(let p of todosPuntos)if(p[0]==c&&p[1]==r)return false;
  for(let t of tr)if(t.cl==c&&t.ro==r)return false;
  let i=TI[tp];if(dn<i.costo)return false;
  dn-=i.costo;
  tr.push({cl:c,ro:r,x:c*CL+CL/2,y:r*CL+CL/2,tp,i,cd:0,ang:0,vid:1,vidMax:i.vida,ralentizando:false});
  rg[c+','+r]=Date.now();setTimeout(()=>{delete rg[c+','+r]},1500);ui();return true;
}
function ui(){
  document.getElementById('dinero').textContent=Math.floor(dn);
  document.getElementById('vidas').textContent=vd;
  document.getElementById('kills').textContent=kl;
  // Contar vidas totales de torres
  let tv=0;
  for(let t of tr)tv+=t.vid;
  document.getElementById('torresV').textContent=tv;
}
function ms(m){document.getElementById('msg').textContent=m;}
function sel(t){ts=t;document.querySelectorAll('.ctl button[id^=bT]').forEach(b=>b.classList.remove('act'));let btn=document.getElementById('bT'+t[1].toUpperCase());if(btn)btn.classList.add('act');ms(t+' $'+TI[t].costo);}
function rein(){dn=500;vd=50;kl=0;ol=0;be=0;en=[];tr=[];bl=[];go=0;vi=0;au=0;rg={};document.getElementById('bAuto').textContent='Auto';document.getElementById('bAuto').className='sec';document.getElementById('bosses').textContent='0';ui();ms('Reiniciado');}
c.onclick=function(e){if(go||vi)return;let rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height),col=Math.floor(x/CL),row=Math.floor(y/CL);if(col>=0&&col<20&&row>=0&&row<20){if(ct(col,row,ts))ms('Listo!');else ms('No se puede');}};
c.onmousemove=function(e){let r=c.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height);};
document.getElementById('bT1').onclick=function(){sel('t1')};
document.getElementById('bT2').onclick=function(){sel('t2')};
document.getElementById('bT3').onclick=function(){sel('t3')};
document.getElementById('bOleada').onclick=function(){if(vi){ms('Ya ganaste!');return}if(go){ms('Game Over!');return}if(en.length==0)gob(ol+1);else ms('Espera');};
document.getElementById('bAuto').onclick=function(){au=!au;this.textContent=au?'Auto ON':'Auto';this.className=au?'sec act':'sec';ms(au?'Auto':'Manual');if(au&&en.length==0&&ol==0)gob(1);};
document.getElementById('bReiniciar').onclick=rein;

// --- DISPARO DE ENEMIGOS (pequeños y bosses) ---
function enemyAtk(e){
  let p=posR(e.dist,e.ruta);
  let rango = e.boss ? RANGO_BOSS : RANGO_ENEMIGO;
  let dmg = e.boss ? DMG_BALA_BOSS : DMG_BALA_ENEMIGO;
  let vel = e.boss ? 2.5 : 3.5;
  let color = e.boss ? '#ff00ff' : '#ff6600';
  // Buscar torre mas cercana dentro del rango
  let obj=null,md=1e9;
  for(let t of tr){
    let d=Math.hypot(p.x-t.x,p.y-t.y);
    if(d<rango&&d<md){md=d;obj=t;}
  }
  if(obj){
    bl.push({x:p.x,y:p.y,obj:{x:obj.x,y:obj.y,tr:obj,tipo:'torre'},dmg:dmg,vel:vel,color:color,vivo:1,en:1});
  }
}

// --- ATAQUE BOSS (igual que antes pero con su dmg) ---
function bossAtk(b){
  let d=b.dj||1;
  let cs=[];
  let p=posR(b.dist,b.ruta);
  for(let t of tr){
    let d2=Math.hypot(p.x-t.x,p.y-t.y);
    if(d2<RANGO_BOSS) cs.push({tr:t,dist:d2});
  }
  cs.sort((a,b)=>a.dist-b.dist);
  let objs=cs.slice(0,d);
  if(objs.length==0){
    bl.push({x:p.x,y:p.y,obj:{x:310,y:310,tr:null},dmg:DMG_BALA_BOSS,vel:2.5,color:'#ff00ff',vivo:1,en:1});
    return;
  }
  for(let o of objs){
    bl.push({x:p.x,y:p.y,obj:{x:o.tr.x,y:o.tr.y,tr:o.tr,tipo:'torre'},dmg:DMG_BALA_BOSS,vel:2.5,color:'#ff00ff',vivo:1,en:1});
  }
}

// --- GAME LOOP ---
setInterval(function(){if(go||vi)return;
// Mover enemigos
for(let i=en.length-1;i>=0;i--){let e=en[i];if(!e.vivo)continue;
let ruta=RUTAS[e.ruta];if(!ruta)continue;
e.dist+=e.vel;
if(!e.boss&&e.vivo){if(!e.cd||e.cd<=0){enemyAtk(e);e.cd=90;}else e.cd--;}
if(e.boss&&e.vivo){if(!e.cd||e.cd<=0){bossAtk(e);e.cd=50-(e.dj||1)*3;}else e.cd--;}
if(e.dist>=ruta.PL){e.vivo=0;vd-=e.boss?5:1;ui();if(vd<=0){go=1;ms('GAME OVER');}}}
// Torres disparan
for(let t of tr){if(t.cd>0){t.cd--;continue;}let obs=[];for(let e of en){if(!e.vivo)continue;let p=posR(e.dist,e.ruta),d2=Math.hypot(p.x-t.x,p.y-t.y);if(d2<t.i.rango)obs.push({e:e,d:d2});}
obs.sort((a,b)=>a.d-b.d);let d2=Math.min(t.i.balas,obs.length);if(d2>0){t.cd=t.i.vel;for(let j=0;j<d2;j++){let o=obs[j].e,p=posR(o.dist,o.ruta);t.ang=Math.atan2(p.y-t.y,p.x-t.x);let ao=(j-(d2-1)/2)*0.08;
// T2 ralentiza
let ralentiza = false;
if(t.tp=='t2'){ralentiza = true; t.ralentizando = true;}
bl.push({x:t.x,y:t.y,o:o,dmg:t.i.dmg,vel:6,color:t.i.color,vivo:1,ao:ao,en:0,ral:ralentiza,tp:t.tp});}}}
// Mover balas
for(let i=bl.length-1;i>=0;i--){let b=bl[i];if(!b.vivo){bl.splice(i,1);continue;}
if(b.en){let tx=b.obj.x,ty=b.obj.y,dx=tx-b.x,dy=ty-b.y,d2=Math.hypot(dx,dy);if(d2<10){
if(b.obj.tr&&tr.includes(b.obj.tr)){let idx=tr.indexOf(b.obj.tr);if(idx>=0){
let t2=b.obj.tr;t2.vid-=b.dmg;if(t2.vid<=0){tr.splice(idx,1);ms('Torre destruida!');}else{ms('Torre danada! vida:'+t2.vid+'/'+t2.vidMax);}ui();}}b.vivo=0;}
else{b.x+=dx/d2*b.vel;b.y+=dy/d2*b.vel;}}
else{if(!b.o.vivo){bl.splice(i,1);continue;}let p=posR(b.o.dist,b.o.ruta),dx=p.x-b.x,dy=p.y-b.y,d2=Math.hypot(dx,dy);if(d2<8){
// Ralentizar si es T2
if(b.ral&&!b.o.ralentizado){b.o.vel*=0.8;b.o.ralentizado=true;setTimeout(()=>{if(b.o.vivo){b.o.vel/=0.8;b.o.ralentizado=false;}},1500);}
b.o.vida-=b.dmg;b.vivo=0;if(b.o.vida<=0){b.o.vivo=0;dn+=b.o.rec;kl++;if(b.o.boss){be++;document.getElementById('bosses').textContent=be;ms('BOSS MUERTO! +$'+b.o.rec);if(ol>=30&&en.filter(e=>e.vivo&&e.boss).length<=1){vi=1;ms('VICTORIA!');}}ui();}}else{let an=Math.atan2(dy,dx)+(b.ao||0);b.x+=Math.cos(an)*b.vel;b.y+=Math.sin(an)*b.vel;}}}
en=en.filter(e=>e.vivo);bl=bl.filter(b=>b.vivo);},33);

setInterval(function(){if(au&&en.length==0&&!go&&!vi&&ol<30)gob(ol+1);},2000);

// --- RENDER ---
setInterval(function(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#1f1f3a';ctx.lineWidth=.5;for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*CL,0);ctx.lineTo(i*CL,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CL);ctx.lineTo(W,i*CL);ctx.stroke();}
for(let ri=0;ri<RUTAS.length;ri++){
  let r=RUTAS[ri];ctx.beginPath();ctx.moveTo(r.px[0].x,r.px[0].y);
  for(let i=1;i<r.px.length;i++)ctx.lineTo(r.px[i].x,r.px[i].y);
  ctx.strokeStyle='#2a2a3a';ctx.lineWidth=16;ctx.stroke();ctx.strokeStyle='#353550';ctx.lineWidth=12;ctx.stroke();ctx.strokeStyle='#4a4a6a';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);
  let ep=r.px[0];ctx.fillStyle=['rgba(68,136,255,0.12)','rgba(68,255,136,0.12)','rgba(255,170,68,0.12)'][ri];ctx.fillRect(ep.x-CL/2,ep.y-CL/2,CL,CL);
  let sp=r.px[r.px.length-1];ctx.fillStyle='rgba(255,68,68,0.1)';ctx.fillRect(sp.x-CL/2,sp.y-CL/2,CL,CL);
}
ctx.font='9px Arial';ctx.fillStyle='#4488ff';ctx.fillText('R1',5,3*CL+20);ctx.fillStyle='#44ff88';ctx.fillText('R2',5,10*CL+20);ctx.fillStyle='#ffaa44';ctx.fillText('R3',5,17*CL+20);
ctx.fillStyle='#f00';ctx.font='bold 9px Arial';ctx.fillText('S1',19*CL+3,3*CL+20);ctx.fillText('S2',19*CL+3,10*CL+20);ctx.fillText('S3',19*CL+3,17*CL+20);
let ahora=Date.now();
for(let t of tr){let k=t.cl+','+t.ro;if(rg[k]&&ahora-rg[k]<1500){ctx.beginPath();ctx.arc(t.x,t.y,t.i.rango,0,Math.PI*2);ctx.strokeStyle=t.i.color+'60';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=t.i.color+'80';ctx.font='8px Arial';ctx.fillText('RANGO '+t.i.rango,t.x-18,t.y-t.i.rango-5);}
let ratio=t.vid/t.vidMax;
let colorT = t.i.color;
if(t.vid==1) colorT = '#ff6666';
else if(t.vid==2&&t.vidMax>2) colorT = '#ffaa44';
ctx.fillStyle=colorT;ctx.shadowColor=t.i.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(t.x,t.y,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x+Math.cos(t.ang)*16,t.y+Math.sin(t.ang)*16);ctx.stroke();
// Indicador de vidas (puntitos)
for(let v=0;v<t.vidMax;v++){ctx.fillStyle=v<t.vid?'#fff':'#333';ctx.beginPath();ctx.arc(t.x-5+v*5,t.y+12,2,0,Math.PI*2);ctx.fill();}
let nb=t.i.balas;for(let kk=0;kk<nb;kk++){let an=-Math.PI/2+(kk-(nb-1)/2)*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x+Math.cos(an)*7,t.y+Math.sin(an)*7,2,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fill();}
let coloresE=['#4488ff','#44ff88','#ffaa44'];
for(let e of en){if(!e.vivo)continue;let p=posR(e.dist,e.ruta),r=e.vida/e.mv;
if(e.boss){ctx.fillStyle='#8b00ff';ctx.shadowColor='#8b00ff88';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(p.x-5,p.y-3,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+5,p.y-3,3,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ff66ff';ctx.font='8px Arial';ctx.fillText('BOSS R'+(e.ruta+1),p.x-18,p.y-28);
ctx.fillStyle='#333';ctx.fillRect(p.x-20,p.y-36,40,5);ctx.fillStyle=r>0.5?'#4f4':(r>0.25?'#ff4':'#f44');ctx.fillRect(p.x-20,p.y-36,40*r,5);
ctx.fillStyle='#fff';ctx.font='7px Arial';ctx.fillText(Math.floor(e.vida),p.x-8,p.y-38);}
else{let bc=coloresE[e.ruta];ctx.fillStyle=bc;ctx.shadowColor=bc+'88';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,8+(1-r)*2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-3,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+3,p.y-3,2,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x-3,p.y-3,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+3,p.y-3,1,0,Math.PI*2);ctx.fill();
if(e.ralentizado){ctx.strokeStyle='rgba(100,200,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.stroke();}
ctx.fillStyle='#333';ctx.fillRect(p.x-12,p.y-16,24,4);ctx.fillStyle=r>.5?'#4f4':(r>.25?'#ff4':'#f44');ctx.fillRect(p.x-12,p.y-16,24*r,4);}}
for(let b of bl){if(!b.vivo)continue;if(b.en){ctx.fillStyle=b.color;ctx.shadowColor=b.color+'88';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();}}
ctx.shadowBlur=0;ctx.shadowColor='transparent';
if(ts&&!go&&!vi){let col=Math.floor(mx/CL),row=Math.floor(my/CL);if(col>=0&&col<20&&row>=0&&row<20){let info=TI[ts],cx=col*CL+CL/2,cy=row*CL+CL/2,ocup=0;
for(let p of todosPuntos)if(p[0]==col&&p[1]==row)ocup=1;for(let t of tr)if(t.cl==col&&t.ro==row)ocup=1;
if(!ocup){ctx.fillStyle=info.color+'50';ctx.beginPath();ctx.arc(cx,cy,11,0,Math.PI*2);ctx.fill();}else{ctx.strokeStyle='#ff000088';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-8,cy-8);ctx.lineTo(cx+8,cy+8);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+8,cy-8);ctx.lineTo(cx-8,cy+8);ctx.stroke();}}}
